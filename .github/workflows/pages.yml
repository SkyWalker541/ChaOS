# ChaOS's website (web/), with the latest release's Brick image and
# SHA256SUMS beside it, on GitHub Pages at
# https://skywalker541.github.io/ChaOS/, where ChaOS Wire's page downloads an
# update (src/release.h, UPDATE_FILES). A web page can't read a release
# download itself, as GitHub sends no CORS header with one; Pages does.
# The release files are never committed: each run puts one release's beside
# the site, so the repository doesn't grow. The device checks the image against
# the SHA-256 GitHub's API gives, never against this copy.
#
# From TortOS 2.2.0. A ChaOS release is made by release.yml with the
# workflow's own token, whose events start no other workflow, so release.yml
# starts this one itself (workflow_dispatch, which that token may do), on
# main, with no tag: the latest release.
#
# ChaOS: and the cheat lists (cheats/, src/cheats.h, tools/cheat-index.py),
# made from libretro-database's newest commit on each run, and weekly so they
# follow it.
#
# Set up once, on GitHub (Settings > Pages > Source: GitHub Actions, or):
#   gh api -X POST repos/SkyWalker541/ChaOS/pages -f build_type=workflow
name: Release files to Pages

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml', 'tools/cheat-index.py']
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # A prerelease stays off Pages: the page offers only the latest release.
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Download the release's images and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          # The release that was published, or the latest when run by hand.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir site
          gh release download $TAG --repo "$GITHUB_REPOSITORY" --dir site \
            --pattern 'ChaOS-v*-brick.img.xz' --pattern SHA256SUMS
          ls -l site
      - name: Check them against SHA256SUMS
        working-directory: site
        run: sha256sum --check --ignore-missing --strict SHA256SUMS
      - name: The website
        run: cp -R web/. site/
      - name: The cheat lists
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout \
            https://github.com/libretro/libretro-database cheatdb
          git -C cheatdb ls-tree -z -r --name-only HEAD cht/ |
            python3 tools/cheat-index.py "$(git -C cheatdb rev-parse HEAD)" site/cheats
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
