# Every check, on every push and pull request, and before every release:
# release.yml calls this and builds nothing unless it passes (2026-11-25).
#
# `make check` is the suite docs/building.md describes, each part there
# because something once broke and nothing noticed; it is offline and needs
# no device. Then the committed launcher: dist/brick/tortos.elf is built on a
# developer's machine and committed, and this says it is an arm64 build and
# carries the version in CHAOS_VERSION, so a release can't ship a stale one.
name: checks

on:
  push:
    branches-ignore: [main, testing]    # those run it through release.yml
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsqlite3-dev zlib1g-dev \
            gcc-aarch64-linux-gnu qemu-user busybox
          # gcc-aarch64-linux-gnu and qemu-user: check-portaudio runs the
          # Brick's own ALSA, OpenAL and SDL, as arm64

      - name: make check
        run: make check

      - name: The committed launcher is this version's
        run: |
          V=$(tr -d ' \n' < CHAOS_VERSION)
          E=dist/brick/tortos.elf
          file "$E" | grep -q 'ELF 64-bit.*ARM aarch64' || { echo "$E is not an arm64 build" >&2; exit 1; }
          strings "$E" | grep -qx "$V" || { echo "$E does not carry version $V: rebuild it" >&2; exit 1; }
          echo "$E: arm64, version $V"
