# A ChaOS release, when a version in CHAOS_VERSION is pushed to main that has
# no release yet. A test build is the same pushed to the testing branch, with
# a version N.N.N-testN: a prerelease, and its ChaOS-ota.txt and notes also on
# the one prerelease tagged "testing", which a Brick on the testing channel
# asks (src/update.h); the website is left alone: the Brick's card image, made from TortOS's release image
# (TORTOS_BASE) with dist/brick's launcher and emulator in it, the source of
# everything in it, and their SHA256SUMS. See dist/README.md.
name: release

on:
  push:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # to start pages.yml once the release is out

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: The version, and whether it is out already
        id: v
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(tr -d ' \n' < CHAOS_VERSION)
          B=$(tr -d ' \n' < TORTOS_BASE)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "base=$B" >> "$GITHUB_OUTPUT"
          # The base a card says it's on (ChaOS/BASE): TortOS's, and ChaOS's
          # own boot files' revision when it carries them (chaos-image.sh)
          if [ -f PLASTRON_REV ]; then echo "cardbase=$B+$(tr -d ' \n' < PLASTRON_REV)"; else echo "cardbase=$B"; fi >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME:$V" in
          testing:*-test[0-9]*) echo "test=1" >> "$GITHUB_OUTPUT" ;;
          main:*-*) echo "main takes releases only, not $V" >&2; exit 1 ;;
          testing:*) echo "the testing branch takes test builds only (N.N.N-testN), not $V" >&2; exit 1 ;;
          esac
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "ChaOS $V is already released"; echo "out=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Tools
        if: steps.v.outputs.out != '1'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools xz-utils mtools

      - name: ChaOS's own program says this version
        if: steps.v.outputs.out != '1'
        run: |
          # 2.6.8 shipped a tortos.elf still built as 2.6.7: the device kept
          # calling itself 2.6.7 and offering the same update again
          V="${{ steps.v.outputs.version }}"
          if ! strings dist/brick/tortos.elf | grep -qx "$V"; then
            echo "dist/brick/tortos.elf was not built as $V; rebuild it" >&2; exit 1
          fi

      - name: TortOS's release, checked
        if: steps.v.outputs.out != '1'
        run: |
          B=${{ steps.v.outputs.base }}
          U=https://github.com/ericreinsmidt/TortOS/releases/download/v$B
          mkdir -p tortos && cd tortos
          for f in SHA256SUMS TortOS-v$B-brick.img.xz TortOS-v$B-brick-sources.tar; do
            curl -fsSL -o "$f" "$U/$f"
          done
          grep -E " TortOS-v$B-brick(\.img\.xz|-sources\.tar)$" SHA256SUMS | sha256sum -c -

      - name: The card image
        if: steps.v.outputs.out != '1'
        run: |
          V=${{ steps.v.outputs.version }}
          B=${{ steps.v.outputs.base }}
          mkdir -p out
          sudo TORTOS_ELF=dist/brick/tortos.elf TORTOS_UPDATE=dist/brick/tortos-update DIATOM_NOTICE=dist/brick/ChaOS-diatom-THIRD-PARTY.md \
            ROOT_OUT=$PWD/root.squashfs APP_OUT=$PWD/out/ChaOS-v$V-brick-app.tar.xz \
            sh tools/chaos-image.sh tortos/TortOS-v$B-brick.img.xz out/ChaOS-v$V-brick.img.xz dist/brick/diatom \
            | tee image.log
          sudo chown -R "$(id -u):$(id -g)" out root.squashfs

      - name: The update over Wi-Fi
        if: steps.v.outputs.out != '1'
        run: |
          # The new root alone, and ChaOS-ota.txt, which the Brick reads from
          # the latest release's downloads to know what it is (src/update.h)
          V=${{ steps.v.outputs.version }}
          B=${{ steps.v.outputs.base }}
          R=ChaOS-v$V-brick-root.squashfs.xz
          A=ChaOS-v$V-brick-app.tar.xz
          S=$(sed -n 's/^system //p' image.log)
          [ -n "$S" ] || { echo "no system id from chaos-image.sh"; exit 1; }
          xz -T0 -9 -c root.squashfs > out/$R
          cat > out/ChaOS-ota.txt <<EOF
          # ChaOS: an update over Wi-Fi. Read by the Brick (src/update.h).
          version = $V
          base = ${{ steps.v.outputs.cardbase }}
          root = $R
          sha256 = $(sha256sum out/$R | cut -d' ' -f1)
          size = $(stat -c%s out/$R)
          system = $S
          app = $A
          app_sha256 = $(sha256sum out/$A | cut -d' ' -f1)
          app_size = $(stat -c%s out/$A)
          notes = $(git log -1 --format=%s | tr -d '\n' | cut -c1-150)
          EOF
          sed -i 's/^          //' out/ChaOS-ota.txt
          cat out/ChaOS-ota.txt
          # What's new, for the Updates screen: the release's commit message
          # without its trailers
          git log -1 --format=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' \
            | head -c 4000 > out/ChaOS-notes.txt

      - name: Its source
        if: steps.v.outputs.out != '1'
        run: |
          V=${{ steps.v.outputs.version }}
          B=${{ steps.v.outputs.base }}
          sh tools/chaos-sources.sh tortos/TortOS-v$B-brick-sources.tar out/ChaOS-v$V-brick-sources.tar
          cd out && sha256sum ChaOS-v* ChaOS-ota.txt ChaOS-notes.txt > SHA256SUMS && cat SHA256SUMS

      - name: Release
        if: steps.v.outputs.out != '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=${{ steps.v.outputs.version }}
          B=${{ steps.v.outputs.base }}
          # What's new first: the same notes the Brick's Updates screen shows
          # (ChaOS-notes.txt), less their "ChaOS N.N.N" line
          { echo "## What's new"; echo; tail -n +2 out/ChaOS-notes.txt | sed '/./,$!d'; echo; echo "---"; echo; } > new.md
          # How to get it: ChaOS Installer takes the latest release only, so a
          # test build says the two ways it can be had
          if [ -n "${{ steps.v.outputs.test }}" ]; then
            HOW="**Get it** on a Brick with ChaOS 2.6.0 or later: MENU > About ChaOS > Update Channels > Pre-Release, then MENU > Updates. Or install it with [ChaOS Installer](https://github.com/SkyWalker541/ChaOS-Installer/releases/latest) 1.1.0 or later, Pre-Release chosen, or write \`ChaOS-v$V-brick.img.xz\` to a card with balenaEtcher or Raspberry Pi Imager (that erases it)."
          else
            HOW="**Install or update** with [ChaOS Installer](https://github.com/SkyWalker541/ChaOS-Installer/releases/latest), or write \`ChaOS-v$V-brick.img.xz\` to a card yourself (that erases it)."
          fi
          cat > notes.md <<EOF
          ChaOS $V for the TrimUI Brick and Brick Hammer.

          $HOW

          ChaOS is built on [TortOS $B](https://github.com/ericreinsmidt/TortOS/releases/tag/v$B) by Eric Reinsmidt. \`ChaOS-v$V-brick-sources.tar\` is the source of everything in the image; what came from where is in [CREDITS.md](https://github.com/SkyWalker541/ChaOS/blob/main/CREDITS.md).
          EOF
          sed -i 's/^          //' notes.md
          cat new.md notes.md > notes2.md && mv notes2.md notes.md
          if [ -n "${{ steps.v.outputs.test }}" ]; then
            printf '\n**A test build**, before release: for the Pre-Release channel (MENU > About ChaOS > Update Channels). It can have bugs.\n' >> notes.md
            gh release create "v$V" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "ChaOS $V (test)" --notes-file notes.md --prerelease
            # The testing channel's pointer: this build's update info, on the
            # one prerelease every Brick on that channel asks
            gh release view testing --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
              gh release create testing --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
                --title "Testing channel" --notes "The newest test build's update info, for Bricks on the testing channel. The builds themselves are the releases named (test)."
            gh release upload testing out/ChaOS-ota.txt out/ChaOS-notes.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$V" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "ChaOS $V" --notes-file notes.md --latest
          fi

      - name: The image on Pages, for ChaOS Wire's page
        if: steps.v.outputs.out != '1' && steps.v.outputs.test != '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        # A release made with this token starts no workflow of its own accord,
        # so pages.yml is started here. If Pages isn't set up yet, that run
        # fails and the release stands: only the page's download needs it.
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main || true
