# A ChaOS release, when a version in CHAOS_VERSION is pushed to main that has
# no release yet: the Brick's card image, made from TortOS's release image
# (TORTOS_BASE) with dist/brick's launcher and emulator in it, the source of
# everything in it, and their SHA256SUMS. See dist/README.md.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # to start pages.yml once the release is out

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: The version, and whether it is out already
        id: v
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(tr -d ' \n' < CHAOS_VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "base=$(tr -d ' \n' < TORTOS_BASE)" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "ChaOS $V is already released"; echo "out=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Tools
        if: steps.v.outputs.out != '1'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools xz-utils

      - name: TortOS's release, checked
        if: steps.v.outputs.out != '1'
        run: |
          B=${{ steps.v.outputs.base }}
          U=https://github.com/ericreinsmidt/TortOS/releases/download/v$B
          mkdir -p tortos && cd tortos
          for f in SHA256SUMS TortOS-v$B-brick.img.xz TortOS-v$B-brick-sources.tar; do
            curl -fsSL -o "$f" "$U/$f"
          done
          grep -E " TortOS-v$B-brick(\.img\.xz|-sources\.tar)$" SHA256SUMS | sha256sum -c -

      - name: The card image
        if: steps.v.outputs.out != '1'
        run: |
          V=${{ steps.v.outputs.version }}
          B=${{ steps.v.outputs.base }}
          mkdir -p out
          sudo TORTOS_ELF=dist/brick/tortos.elf TORTOS_UPDATE=dist/brick/tortos-update DIATOM_NOTICE=dist/brick/ChaOS-diatom-THIRD-PARTY.md \
            ROOT_OUT=$PWD/root.squashfs APP_OUT=$PWD/out/ChaOS-v$V-brick-app.tar.xz \
            sh tools/chaos-image.sh tortos/TortOS-v$B-brick.img.xz out/ChaOS-v$V-brick.img.xz dist/brick/diatom \
            | tee image.log
          sudo chown -R "$(id -u):$(id -g)" out root.squashfs

      - name: The update over Wi-Fi
        if: steps.v.outputs.out != '1'
        run: |
          # The new root alone, and ChaOS-ota.txt, which the Brick reads from
          # the latest release's downloads to know what it is (src/update.h)
          V=${{ steps.v.outputs.version }}
          B=${{ steps.v.outputs.base }}
          R=ChaOS-v$V-brick-root.squashfs.xz
          A=ChaOS-v$V-brick-app.tar.xz
          S=$(sed -n 's/^system //p' image.log)
          [ -n "$S" ] || { echo "no system id from chaos-image.sh"; exit 1; }
          xz -T0 -9 -c root.squashfs > out/$R
          cat > out/ChaOS-ota.txt <<EOF
          # ChaOS: an update over Wi-Fi. Read by the Brick (src/update.h).
          version = $V
          base = $B
          root = $R
          sha256 = $(sha256sum out/$R | cut -d' ' -f1)
          size = $(stat -c%s out/$R)
          system = $S
          app = $A
          app_sha256 = $(sha256sum out/$A | cut -d' ' -f1)
          app_size = $(stat -c%s out/$A)
          notes = $(git log -1 --format=%s | tr -d '\n' | cut -c1-150)
          EOF
          sed -i 's/^          //' out/ChaOS-ota.txt
          cat out/ChaOS-ota.txt
          # What's new, for the Updates screen: the release's commit message
          # without its trailers
          git log -1 --format=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' \
            | head -c 4000 > out/ChaOS-notes.txt

      - name: Its source
        if: steps.v.outputs.out != '1'
        run: |
          V=${{ steps.v.outputs.version }}
          B=${{ steps.v.outputs.base }}
          sh tools/chaos-sources.sh tortos/TortOS-v$B-brick-sources.tar out/ChaOS-v$V-brick-sources.tar
          cd out && sha256sum ChaOS-v* ChaOS-ota.txt ChaOS-notes.txt > SHA256SUMS && cat SHA256SUMS

      - name: Release
        if: steps.v.outputs.out != '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=${{ steps.v.outputs.version }}
          B=${{ steps.v.outputs.base }}
          cat > notes.md <<EOF
          ChaOS $V for the TrimUI Brick and Brick Hammer.

          **Install or update** with [ChaOS Installer](https://github.com/SkyWalker541/ChaOS-Installer/releases/latest), or write \`ChaOS-v$V-brick.img.xz\` to a card yourself (that erases it).

          ChaOS is built on [TortOS $B](https://github.com/ericreinsmidt/TortOS/releases/tag/v$B) by Eric Reinsmidt. \`ChaOS-v$V-brick-sources.tar\` is the source of everything in the image; what came from where is in [CREDITS.md](https://github.com/SkyWalker541/ChaOS/blob/main/CREDITS.md).
          EOF
          sed -i 's/^          //' notes.md
          gh release create "v$V" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ChaOS $V" --notes-file notes.md

      - name: The image on Pages, for ChaOS Wire's page
        if: steps.v.outputs.out != '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        # A release made with this token starts no workflow of its own accord,
        # so pages.yml is started here. If Pages isn't set up yet, that run
        # fails and the release stands: only the page's download needs it.
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main || true
