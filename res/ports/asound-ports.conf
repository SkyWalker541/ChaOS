# ChaOS: ALSA for ports (res/ports/run.sh, ALSA_CONFIG_PATH): the sound
# hardware itself as the default device, through plug for the rate and
# format a port asks for, not the shared mixer (dmix) the rest of ChaOS
# plays through (/etc/asound.conf). Nothing else plays while a port runs,
# and some ports' audio (Doukutsu-rs's, cpal) failed on the mixer after a
# while and then hung the game: menus, the volume slider and Quit
# (Aquilus, 2.7.9-test5). Read after alsa.conf, so it takes the place of
# /etc/asound.conf's default.
pcm.!default { type plug; slave.pcm "hw:0,0" }
ctl.!default { type hw; card 0 }
